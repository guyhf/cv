name: CI & Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install TeX dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build site (HTML + LaTeX)
        run: python build.py

      - name: Compile PDF
        # res.sty is in the repo root, so run from there.
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error \
            -output-directory=output output/resume.tex
          mv output/resume.pdf output/guyhf.pdf

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # Deploy only the web assets (index.html + guyhf.pdf); never the
      # intermediate .tex/.aux/.log.
      # Buckets are private behind CloudFront (OAC); no object ACLs. After each
      # sync, invalidate the two cached objects so changes go live immediately.
      - name: Deploy to www.guyhf.com
        run: |
          aws s3 sync output/ s3://www.guyhf.com \
            --cache-control max-age=21600 \
            --exclude "*" --include "index.html" --include "guyhf.pdf"
          aws cloudfront create-invalidation \
            --distribution-id E3GWSG61YLV4LV \
            --paths "/index.html" "/guyhf.pdf"

      - name: Deploy to resume.guyhf.com
        run: |
          aws s3 sync output/ s3://resume.guyhf.com \
            --cache-control max-age=21600 \
            --exclude "*" --include "index.html" --include "guyhf.pdf"
          aws cloudfront create-invalidation \
            --distribution-id E1CHTNI2R01HU2 \
            --paths "/index.html" "/guyhf.pdf"
